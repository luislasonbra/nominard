services:
  jenkins:
    build: .
    user: root            # solo para aprender en tu PC; no usar así en un servidor público
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  jenkins_home:
